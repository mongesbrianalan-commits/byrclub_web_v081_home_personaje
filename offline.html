<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a42d8">
  <title>Sin conexión — BYR Club</title>
  <style>
    html,body{margin:0;height:100%}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#0053c3;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
    .box{max-width:360px}
    img{width:180px;height:auto;margin-bottom:22px}
    h1{margin:0 0 10px;font-size:1.6rem}
    p{margin:0 0 24px;line-height:1.45;color:#dbe7ff;font-weight:600}
    button{padding:14px 26px;border:0;border-radius:14px;background:#ffd51f;color:#081242;font-weight:900;font-size:1rem;box-shadow:0 6px 0 #b88900;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <img src="/assets/logo-byr.png" alt="BYR">
    <h1>Estás sin conexión</h1>
    <p>Para ver tus puntos, pedir o jugar necesitás internet. Fijate el wifi o los datos y volvé a probar.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
