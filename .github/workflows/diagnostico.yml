name: Diagnostico FTP (listar carpetas)

# Solo se lanza a mano desde la pestaña Actions.
# Lista carpetas puntuales del servidor para saber cual sirve byrclub.com.
# NO sube ni borra nada. Rapido: no recorre todo el arbol.
on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Listar carpetas clave del FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftps://$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 2
          echo "===== [A] RAIZ DEL FTP (donde caemos al conectar) ====="
          cls -l
          echo "===== [B] CONTENIDO DE public_html/ (donde subio el deploy) ====="
          cls -l public_html/ || echo "(no existe public_html/)"
          echo "===== [C] CONTENIDO DE domains/ ====="
          cls -l domains/ || echo "(no existe domains/)"
          echo "===== [D] CONTENIDO DE domains/byrclub.com/ ====="
          cls -l domains/byrclub.com/ || echo "(no existe)"
          echo "===== [E] CONTENIDO DE domains/byrclub.com/public_html/ ====="
          cls -l domains/byrclub.com/public_html/ || echo "(no existe)"
          bye
          EOF
