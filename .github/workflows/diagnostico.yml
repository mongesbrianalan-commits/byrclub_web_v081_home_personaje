name: Diagnostico FTP (listar carpetas)

# Solo se lanza a mano desde la pestaña Actions.
# Lista COMPLETA la carpeta real del sitio para saber que se borraria
# en un sync. NO sube ni borra nada.
on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Listar contenido completo del docroot real
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:timeout 15
          set net:max-retries 2
          set net:reconnect-interval-base 5
          echo "===== ARBOL COMPLETO de /domains/byrclub.com/public_html/ ====="
          find --max-depth=4 /domains/byrclub.com/public_html/
          bye
          EOF
