name: Diagnostico FTP (listar carpetas)

# Solo se lanza a mano desde la pestaña Actions.
# Lista la estructura del servidor para saber cual es la carpeta
# real que sirve byrclub.com. NO sube ni borra nada.
on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Listar arbol de carpetas del FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftps://$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          echo ">>>>> RAIZ DEL FTP (donde caemos al conectar):"
          cls -l
          echo ""
          echo ">>>>> ARBOL COMPLETO (hasta 3 niveles):"
          find --max-depth=3 /
          bye
          EOF
