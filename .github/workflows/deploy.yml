name: Deploy a hosting (FTP)

# Se ejecuta cada vez que se sube (push) un cambio a la rama main.
# Tambien se puede lanzar a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repo
        uses: actions/checkout@v4

      # El hosting manda "Cache-Control: max-age=604800" en el CSS y el JS, o
      # sea que el navegador del cliente los guarda UNA SEMANA. Sin esto, un
      # arreglo publicado hoy no le llega hasta dentro de siete dias: el HTML
      # se actualiza, pero sigue apuntando al mismo archivo que ya tiene.
      #
      # En el repo las referencias van con "?v=DEV" (asi funcionan al abrir
      # los archivos a mano). Aca se reemplaza por el sha del commit, asi cada
      # publicacion estrena direccion y el navegador la baja de cero.
      #
      # Los HTML se van a resubir en cada deploy porque el sha cambia: son
      # chicos, no es problema.
      - name: Versionar CSS y JS (para que el cache no tape los cambios)
        run: |
          VER="${GITHUB_SHA:0:7}"
          echo "Versionando assets con ?v=$VER"
          find . -name '*.html' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './tools/*' \
            -exec sed -i "s/?v=DEV/?v=$VER/g" {} +
          echo "Referencias versionadas:"
          grep -rho '?v=[a-f0-9]\{7\}' --include='*.html' . | sort | uniq -c

      - name: Subir por FTP al hosting
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Carpeta REAL que sirve byrclub.com (ruta absoluta, confirmada por
          # diagnostico FTP). OJO: al conectar caemos en /public_html, que NO
          # es la carpeta servida; la verdadera esta un nivel mas alla.
          server-dir: /domains/byrclub.com/public_html/
          # Protocolo seguro. Si tu hosting no soporta FTPS, cambiar a: ftp
          protocol: ftps
          # Timeout por operacion FTP (ms). Subimos a 60s porque el default
          # de 30s a veces corta con Hostinger lento ("Timeout control socket").
          timeout: 120000
          # Archivos que NUNCA se tocan en el servidor:
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tools/**
            .github/**
            api/config.php
            **/.ftp-deploy-sync-state.json

      # Hostinger a veces corta la conexion FTP ("Timeout control socket").
      # Reintentamos con esperas crecientes para aguantar cortes transitorios.

      # --- Intento 2 (tras esperar 45s) ---
      - name: Esperar antes del 2do intento
        if: steps.ftp1.outcome == 'failure'
        run: sleep 45

      - name: Reintentar subida por FTP (2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/byrclub.com/public_html/
          protocol: ftps
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tools/**
            .github/**
            api/config.php
            **/.ftp-deploy-sync-state.json

      # --- Intento 3 (tras esperar 90s). Si este falla, el deploy queda en rojo. ---
      - name: Esperar antes del 3er intento
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 90

      - name: Reintentar subida por FTP (3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/byrclub.com/public_html/
          protocol: ftps
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tools/**
            .github/**
            api/config.php
            **/.ftp-deploy-sync-state.json
