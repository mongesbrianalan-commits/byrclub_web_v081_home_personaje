name: Limpieza (borrar carpeta legacy public_html)

# Un solo uso. Borra la carpeta /public_html (legacy, NO servida) donde
# cayeron por error archivos durante la configuracion del deploy.
# El sitio real vive en /domains/byrclub.com/public_html/ y NO se toca.
on:
  workflow_dispatch:

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Borrar /public_html legacy
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:timeout 15
          set net:max-retries 2
          echo "===== ANTES: contenido de /public_html/ ====="
          cls -l /public_html/ || echo "(no existe)"
          echo "===== Vaciando /public_html (la carpeta en si no se puede borrar) ====="
          rm -r /public_html/public_html
          rm -r /public_html/api
          rm -r /public_html/assets
          glob rm -f /public_html/*.txt
          glob rm -f /public_html/*.html
          glob rm -f /public_html/*.css
          glob rm -f /public_html/*.js
          rm -f /public_html/.ftp-deploy-sync-state.json
          echo "===== DESPUES: /public_html deberia quedar VACIA ====="
          cls -la /public_html/ || echo "(vacia)"
          echo "===== Verificacion: el sitio real sigue intacto ====="
          cls -l /domains/byrclub.com/public_html/index.html
          bye
          EOF
